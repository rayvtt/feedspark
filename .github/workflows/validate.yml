name: Validate

# Pre-merge guard so a broken change can't reach main (and can't cause a broken or
# stale deploy): prove the worker still bundles, and that the dashboard pages' inline
# scripts still parse. Runs on PRs and on pushes to any branch except main (main is
# covered by the deploy workflow).

on:
  pull_request: {}
  push:
    branches-ignore: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Dry-run build the worker (bundles worker.js + the HTML text modules)
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/wr-out

      - name: Syntax-check the dashboard pages' inline scripts
        run: node tools/check_inline_scripts.js

      - name: Label Guard engine unit tests
        run: node tools/test_labelguard.mjs
      - name: Feed Lab AI-readiness model (conversational weighting, custom labels unscored)
        run: node tools/test_feedlab.mjs
      - name: Overlays engine unit tests (URL-string classification + collector)
        run: node tools/test_overlays.mjs
      - name: Text-module tripwire (a served engine must bundle as a string)
        run: node tools/check_textmodules.js
      - name: Image library engine unit tests (shot tokens off the URL + collector)
        run: node tools/test_images.mjs
      - name: KWCal tie + result-window harness (event ⇄ Workflow ticket)
        run: node tools/test_kwcal_tie.mjs
      - name: KWCal KPI band + market list
        run: node tools/test_kwcal_kpis.mjs
      - name: KWCal client PDF (one-click download + the reported results on it)
        run: NODE_PATH=$(npm root -g) node tools/test_kwcal_pdf.mjs
      - name: KWCal stage map (every Workflow stage has a client word)
        run: NODE_PATH=$(npm root -g) node tools/test_kwcal_stages.mjs
      - name: Product-volume churn harness (running close-to-close baseline)
        run: node tools/test_volume.mjs
      - name: New-product arrivals harness (first-seen dates → month / quarter / year + forecast)
        run: node tools/test_arrivals.mjs
      - name: AI Mode harness (conversational attributes priced by data source)
        run: node tools/test_aimode.mjs
      - name: Access scoping harness (per-user Workflow views)
        run: node tools/test_access.mjs
      - name: Shared working state harness (one team, one store)
        run: node tools/test_sharedstate.mjs
      - name: Brief recovery harness (the brief email rebuilds a missing ticket)
        run: node tools/test_briefrecover.mjs
      - name: Golden Record PDP harvest harness (extraction + host allowlist + sampler)
        run: node tools/test_pdpharvest.mjs
      - name: Vietnamese UI toggle harness (engine rules + seed integrity + owner gating)
        run: node tools/test_i18n.mjs
      - name: AI transformation roadmap harness (roadmap shape, progress maths, opt-in gate, no commercial figures)
        run: node tools/test_transform.mjs
      - name: Task Manager harness (parser, agent, worker store + scoped read, Leadership overlay)
        run: node tools/test_tm.mjs
      - name: Task Manager automatic sync harness (MCP transport, rotation, ticket hours, lifted tmPull vs a stub MCP)
        run: node tools/test_tmmcp.mjs
      - name: ROAS harness (FeedHero_reports MCP — currency-safe rollup, FeedSpark-only roster, worker wiring)
        run: node tools/test_roas.mjs
      - name: Phone-layer harness (bottom bar, sheets, mirror rules, pan sweep, wiring)
        run: node tools/test_mobile.mjs

      - name: Build Log suggestion engine (evidence-led, unread is never a zero)
        run: node tools/test_buildsuggest.mjs
      - name: Scheduled Work harness (the content team's sheet → skip cadence per brand)
        run: node tools/test_schedule.mjs
      - name: Work-volumes harness (every workstream bucketed by month)
        run: node tools/test_volumes.mjs
      - name: Retainer-hours harness (how delivered hours are classified for the one-pager pie)
        run: node tools/test_reporthours.mjs
      - name: Dossier live-work harness (running tests read from the pipeline)
        run: node tools/test_dossierlive.mjs
      - name: Deep-link harness (suggested next moves arrive filtered)
        run: node tools/test_deeplink.mjs
      - name: Golden Record snapshot harness (dossier popup; unscanned never counted as zero)
        run: node tools/test_goldensnap.mjs
      - name: Present harness (the one-pager played — one renderer, the number rule)
        run: node tools/test_present.mjs
      - name: Output escaping (every esc() neutralises a quote — XSS)
        run: node tools/test_escaping.mjs

      - name: Audit colour bands harness (one legend on /golden, /feedlab, the dossier, the Playbook rail)
        run: node tools/test_bands.mjs
      - name: Golden Record score history harness (one reading per real move, re-scored to today's profile)
        run: node tools/test_goldenhist.mjs
      - name: Dossier tiles harness (hours meter, feed-audit bars, Golden Record ring)
        run: node tools/test_dossiertiles.mjs
      - name: Hero KPI harness (project plans are the source; one date rule with Workflow)
        run: node tools/test_hero.mjs
      - name: FS Task Manager harness (search grammar, billable split, page/engine parity)
        run: node tools/test_reporttasks.mjs
      - name: UI-state persistence harness (a bare reload does not blank the page)
        run: node tools/test_uistate.mjs
      - name: FCC hours badge harness (three-month trail, posture, widget/engine parity)
        run: node tools/test_hoursbadge.mjs
      - name: Playbook panel harness (practices, the 10–20% collection band, weak attributes)
        run: node tools/test_playbook_panel.mjs
      - name: Call wrap-up (red prompt, the tidy-up, draft on FCC or Gmail)
        run: node tools/test_callwrap.mjs
      - name: One-modal-at-a-time guard (every overlay opener routes through soloModal)
        run: node tools/test_modalsolo.mjs
      - name: Workflow intake table (Task takes the slack; every row one height)
        run: node tools/test_wfintake.mjs
      - name: AM CC harness (name→address resolution, dedupe, never yourself, never guessed)
        run: node tools/test_amcc.mjs
      - name: Excel export harness (XLSX container + the Task Manager's three tabs)
        run: node tools/test_xlsx.mjs
      - name: Shipped-panel harness (build log slide-over, first-run silence, close-the-tab prompt)
        run: node tools/test_shipped.mjs
      - name: Instructions-collapse harness (one ⓘ per card, stable key, the marked lines)
        run: node tools/test_instr.mjs

      - name: Shipped-feature markers (multi-session overwrite tripwire)
        run: node tools/check_markers.js

      - name: Module-nav parity (the menu stays identical on every app page)
        run: node tools/check_nav.js

      - name: Reply classifier in sync (worker briefmatch = Workflow page)
        run: node tools/test_replyclass.mjs
      - name: Read-out extraction (worker + page parity)
        run: node tools/test_readout.mjs

      - name: Test-running stage in sync (worker briefmatch = Workflow page)
        run: node tools/test_running_stage.mjs

      - name: Labelguard browser-engine copy in sync (served /labels/engine.js = src)
        run: node tools/check_lgcopy.js
