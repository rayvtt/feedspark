<!-- FCC-SPOTS — spot illustrations for the module cards, GMC-style --------------------------------
     Ray, 29 Sep 2026, over Google Merchant Center's "What to do next" cards, each carrying a small
     two-tone illustration at its side: "do a quick review of latest 10 modules just build on FCC to
     generate / add in icons like (similar) to GMC like this to ease on eye strain".

     A dense card of figures and sentences has nothing for the eye to land on; one small picture per
     card gives it a landmark and tells the reader what KIND of card it is before a word is read.
     This widget is the ONE set (sixteen spots, one drawing language — a soft disc, a paper sheet,
     grey line work, one orange accent) so every module's art matches, and it is placed by ONE rule:
     an element carrying `data-spot="<name>"` gets its spot —
       · a hero (any host inside .hero): the art sits at the top-right of the hero's CONTENT box,
         72px — the height of eyebrow + title, so it stops above the status row under them, whose
         buttons live at the right (the ⓘ collapse hides every multi-sentence lede on the live page,
         so that row sits directly under the title); the host is the padded .wrap on most pages but
         the padded .hero section on /tasks, so the offsets are read off the host's own padding, not
         assumed; the eyebrow / title / lede keep clear of it; not drawn on a phone (decorative —
         nothing a reader can do is lost);
       · a card with a header row (.chead / .blk-h / .cw-head / .thead): the spot is prepended to the
         row, 44px, to the LEFT of the title block — so it never collides with the tools that live at
         the row's right (GMC's art sits at the right of a card that carries no controls; ours do);
         the title block is capped at the row's width less the spot, so a wrapping row can never drop
         it under the spot (the Performance card on /roas did exactly that) while the tools wrap just
         as the page laid them out; on a phone the digest fold hides a card's content, spot included,
         until the card is opened — the tap row is the digest widget's;
       · a card with no header row: the top-right corner, with the heading and lede padded clear.
     Every spot is decorative (aria-hidden) and never the only carrier of a meaning — the title says
     what the card is; the art only makes it faster to find. Colours are the widget's own tokens with
     a dark-mode set, so the art never reads as a light island in the dark theme, and no fill or stroke
     is written into the SVG itself (classes only), so the whole set re-colours from one place.
     The set is documented, with its names, on /design § Spot illustrations. Harness
     tools/test_spots.mjs + tools/check_spots.js.
-->
<style>
.spot{display:inline-block;flex:none;line-height:0;vertical-align:middle;
  --sp-paper:#fff;--sp-grey:#F1F2F4;--sp-line:#E3E5E8;--sp-muted:#A6AFBA;--sp-orange:#F5A623;--sp-orange-deep:#ED6F0B}
[data-theme=dark] .spot{--sp-paper:#1C1F27;--sp-grey:#20242E;--sp-line:#2C3039;--sp-muted:#6F7A88}
.spot svg{width:100%;height:100%;display:block;overflow:visible}
.spot .g{fill:var(--sp-grey)}
.spot .p{fill:var(--sp-paper);stroke:var(--sp-line);stroke-width:1.5}
.spot .l{fill:none;stroke:var(--sp-muted);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.spot .la{fill:none;stroke:var(--sp-orange);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.spot .lb{fill:none;stroke:var(--sp-orange);stroke-width:6;stroke-linecap:round}
.spot .ld{fill:none;stroke:var(--sp-muted);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:4 4}
.spot .lf{fill:var(--sp-muted);opacity:.35}
.spot .d{fill:var(--sp-muted)}
.spot .c{fill:var(--sp-line)}
.spot .a{fill:var(--sp-orange)}
.spot .ad{fill:var(--sp-orange-deep)}
.spot .at{fill:var(--sp-orange);opacity:.18}
.spot .wf{fill:var(--sp-paper)}
.spot .w{fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.spot .ws{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* on a card's header row: left of the title block, clear of the tools at the row's right */
.spot-card{width:44px;height:44px;margin:-3px 2px 0 0}
.mod>.chead>.spot-card{width:34px;height:34px;margin-top:-1px}
/* the title block shares the spot's line: capped at the row less the spot, so a wrapping row never drops it
   under the spot; its own width otherwise, so the tools wrap exactly as the page laid them out */
.spot-row>.spot+*{max-width:calc(100% - 64px)}
/* a card with no header row: the top-right corner, the heading and lede padded clear */
.spot-host-corner{position:relative}
.spot-corner{position:absolute;top:14px;right:16px;width:44px;height:44px}
.spot-host-corner>h2,.spot-host-corner>h3,.spot-host-corner>.ch,.spot-host-corner>.sub{padding-right:64px}
/* the hero: the art beside the title block at the host's content corner (right/top are restated inline by
   place() from the host's own padding — the padded .wrap on most pages, the padded .hero section on /tasks);
   72px = eyebrow + title, so it ends above the status row whose buttons sit at the right; not drawn on a phone */
.spot-host-hero{position:relative}
.spot-hero{position:absolute;right:22px;top:-4px;width:72px;height:72px}
.spot-host-hero>.eyebrow,.spot-host-hero>h1,.spot-host-hero>.sub{padding-right:96px}
@media (max-width:760px){
  .spot-hero{display:none}
  .spot-host-hero>.eyebrow,.spot-host-hero>h1,.spot-host-hero>.sub{padding-right:0}
  .spot-card,.spot-corner{width:36px;height:36px}
}
@media print{.spot{display:none!important}}
</style>
<script>
(function () {
  if (window.__fccSpots) return; window.__fccSpots = 1;
  // ONE drawing language: a soft disc (.g), a paper sheet (.p), grey line work (.l/.d/.lf/.c) and one
  // orange accent (.a/.la) — classes only, so the set re-colours from the stylesheet above.
  var O = '<svg viewBox="0 0 96 96" aria-hidden="true" focusable="false">', C = '</svg>';
  var G = '<circle class="g" cx="50" cy="52" r="40"/>';
  var SHEET = '<rect class="p" x="20" y="16" width="56" height="64" rx="8"/>';
  var SP = {
    // a document of rows — a feed, a list, a table
    feed: O + G + '<rect class="p" x="22" y="14" width="50" height="64" rx="8"/>'
      + '<path class="l" d="M32 30h30M32 42h30M32 54h20"/>'
      + '<circle class="a" cx="70" cy="70" r="11"/><path class="w" d="M64.5 70l3.5 3.5 7-7"/>' + C,
    // bars rising — a figure, a trend, a scorecard
    chart: O + G + SHEET
      + '<rect class="lf" x="30" y="50" width="9" height="18" rx="2"/><rect class="lf" x="43" y="40" width="9" height="28" rx="2"/>'
      + '<rect class="a" x="56" y="30" width="9" height="38" rx="2"/><path class="l" d="M27 70h42"/>'
      + '<circle class="a" cx="74" cy="22" r="10"/><path class="w" d="M74 27v-10M69.5 21.5l4.5-4.5 4.5 4.5"/>' + C,
    // a bell with its dot — alerts, movers, what changed
    alert: O + G + SHEET
      + '<path class="l" d="M48 30c-8 0-13 6-13 13v9l-4 6h34l-4-6v-9c0-7-5-13-13-13zM43 61a5 5 0 0 0 10 0"/>'
      + '<circle class="a" cx="63" cy="30" r="7"/>' + C,
    // a bulb — how it is measured, the method, the finding
    insight: O + G + SHEET
      + '<path class="l" d="M48 28a13 13 0 0 1 7 24l-2 6H43l-2-6a13 13 0 0 1 7-24zM43 64h10M45 70h6"/>'
      + '<path class="la" d="M48 20v-4M32 34l-3-3M64 34l3-3"/>' + C,
    // a magnifier — search, a drill-down, a live read
    search: O + G + SHEET
      + '<circle class="at" cx="44" cy="44" r="12"/><circle class="l" cx="44" cy="44" r="12"/><path class="lb" d="M54 54l10 10"/>' + C,
    // a rosette with a tick — coverage, a pass, a standard met
    check: O + G + '<path class="lf" d="M38 58l-5 20 15-7 15 7-5-20z"/>'
      + '<circle class="a" cx="48" cy="44" r="17"/><path class="w" d="M39.5 44.5l6 6 12-12"/>' + C,
    // a speech bubble and a sparkle — AI answers, an assistant
    ai: O + G + '<path class="p" d="M28 26h36a7 7 0 0 1 7 7v18a7 7 0 0 1-7 7H46l-9 9v-9h-9a7 7 0 0 1-7-7V33a7 7 0 0 1 7-7z"/>'
      + '<circle class="d" cx="38" cy="42" r="2.4"/><circle class="d" cx="46" cy="42" r="2.4"/><circle class="d" cx="54" cy="42" r="2.4"/>'
      + '<path class="a" d="M72 12l2.6 6.4 6.4 2.6-6.4 2.6L72 30l-2.6-6.4L63 21l6.4-2.6z"/>' + C,
    // two parcels — stock, availability, what is on the shelf
    stock: O + G + '<rect class="p" x="40" y="24" width="32" height="26" rx="4"/><path class="l" d="M56 24v26"/>'
      + '<rect class="p" x="22" y="50" width="34" height="28" rx="4"/><path class="l" d="M39 50v28"/>'
      + '<circle class="a" cx="70" cy="66" r="10"/><path class="w" d="M65 66l3.5 3.5 6.5-7"/>' + C,
    // three switches, one on — rules, settings, set-up
    rules: O + G + SHEET
      + '<rect class="lf" x="30" y="29" width="20" height="11" rx="5.5"/><circle class="wf" cx="35.5" cy="34.5" r="3.5"/>'
      + '<rect class="a" x="30" y="45" width="20" height="11" rx="5.5"/><circle class="wf" cx="44.5" cy="50.5" r="3.5"/>'
      + '<rect class="lf" x="30" y="61" width="20" height="11" rx="5.5"/><circle class="wf" cx="35.5" cy="66.5" r="3.5"/>'
      + '<path class="l" d="M56 34.5h12M56 50.5h12M56 66.5h8"/>' + C,
    // a product card with a tee — the catalogue, a product, a listing
    catalog: O + G + '<rect class="p" x="24" y="14" width="48" height="66" rx="8"/>'
      + '<path class="a" d="M40 30l6-4h4l6 4 8 6-6 5v21H38V41l-6-5z"/><path class="l" d="M34 70h28"/>' + C,
    // a path with milestones and a flag — a roadmap, a migration, a plan
    migration: O + G + SHEET
      + '<path class="ld" d="M30 66c8-12 16 2 26-10 5-6 7-12 12-18"/>'
      + '<circle class="d" cx="30" cy="66" r="4"/><circle class="d" cx="49" cy="58" r="4"/>'
      + '<path class="l" d="M68 40V24"/><path class="a" d="M68 24h12l-4 4 4 4H68z"/><circle class="a" cx="68" cy="40" r="4"/>' + C,
    // a coin over a rising line — return on spend, revenue, money
    roas: O + G + SHEET
      + '<path class="l" d="M28 66l11-10 10 6 13-14M56 48h6v6"/>'
      + '<circle class="a" cx="64" cy="32" r="11"/><circle class="w" cx="64" cy="32" r="5.5"/>' + C,
    // a clipboard with one row ticked — tasks, a plan, the book of hours
    tasks: O + G + '<rect class="p" x="26" y="20" width="44" height="58" rx="7"/><rect class="d" x="39" y="15" width="18" height="10" rx="3"/>'
      + '<rect class="l" x="34" y="34" width="7" height="7" rx="1.5"/><path class="l" d="M47 37.5h16"/>'
      + '<rect class="a" x="34" y="47" width="7" height="7" rx="1.5"/><path class="ws" d="M35.5 50.5l1.8 1.8 3.2-3.5"/><path class="l" d="M47 50.5h16"/>'
      + '<rect class="l" x="34" y="60" width="7" height="7" rx="1.5"/><path class="l" d="M47 63.5h10"/>' + C,
    // two photographs — images, media, the shot library
    images: O + G + '<rect class="p" x="32" y="20" width="42" height="34" rx="6"/><rect class="p" x="22" y="34" width="42" height="36" rx="6"/>'
      + '<path class="lf" d="M26 66l10-13 8 9 6-6 10 10H26z"/><circle class="a" cx="52" cy="44" r="4.5"/>' + C,
    // a calendar with one day marked — a schedule, a cadence, a date
    schedule: O + G + '<rect class="p" x="22" y="22" width="52" height="56" rx="7"/><path class="l" d="M22 36h52M34 16v10M62 16v10"/>'
      + '<rect class="c" x="30" y="43" width="8" height="7" rx="2"/><rect class="c" x="41" y="43" width="8" height="7" rx="2"/><rect class="c" x="52" y="43" width="8" height="7" rx="2"/><rect class="c" x="63" y="43" width="8" height="7" rx="2"/>'
      + '<rect class="c" x="30" y="54" width="8" height="7" rx="2"/><rect class="c" x="41" y="54" width="8" height="7" rx="2"/><rect class="a" x="52" y="54" width="8" height="7" rx="2"/><rect class="c" x="63" y="54" width="8" height="7" rx="2"/>'
      + '<rect class="c" x="30" y="65" width="8" height="7" rx="2"/><rect class="c" x="41" y="65" width="8" height="7" rx="2"/><rect class="c" x="52" y="65" width="8" height="7" rx="2"/>'
      + '<path class="ws" d="M54 57.5l1.6 1.6 3-3.2"/>' + C,
    // swatches and a brush stroke — design, the brand, a template
    design: O + G + SHEET
      + '<circle class="a" cx="36" cy="38" r="8"/><circle class="d" cx="52" cy="38" r="8"/><circle class="c" cx="66" cy="38" r="8"/>'
      + '<path class="lb" d="M30 62c12-9 26-9 38 0"/>' + C
  };
  var ROWS = ':scope > .chead, :scope > .blk-h, :scope > .cw-head, :scope > .thead';
  function make(name, cls) {
    var s = document.createElement('span'); s.className = 'spot ' + cls + ' spot-' + name;
    s.setAttribute('aria-hidden', 'true'); s.innerHTML = SP[name]; return s;
  }
  function place(host) {
    var name = host.getAttribute('data-spot');
    if (!SP[name] || host.getAttribute('data-spot-done')) return;
    host.setAttribute('data-spot-done', name);
    if (host.closest('.hero')) {
      // the host's CONTENT corner: the padded .wrap (right 22px, top 0) on most pages, the padded .hero
      // section (right 0, top 30px) on /tasks — read, never assumed, or the art floats 22px short and 28px high
      var s = make(name, 'spot-hero'), cs = getComputedStyle(host);
      s.style.right = cs.paddingRight; s.style.top = (parseFloat(cs.paddingTop) - 4) + 'px';
      host.classList.add('spot-host-hero'); host.appendChild(s); return;
    }
    var row = host.querySelector(ROWS);
    if (row) { row.classList.add('spot-row'); row.insertBefore(make(name, 'spot-card'), row.firstChild); return; }
    host.classList.add('spot-host-corner'); host.appendChild(make(name, 'spot-corner'));
  }
  function scan() { var hs = document.querySelectorAll('[data-spot]:not([data-spot-done])'); for (var i = 0; i < hs.length; i++) place(hs[i]); }
  var t = 0; function later() { if (t) return; t = setTimeout(function () { t = 0; scan(); }, 80); }
  function mount() {
    scan();
    // a card rendered after load (a page that draws its sections from data) gets its spot too
    try { new MutationObserver(function (ms) { for (var i = 0; i < ms.length; i++) { if (ms[i].addedNodes && ms[i].addedNodes.length) { later(); return; } } }).observe(document.body, { childList: true, subtree: true }); } catch (e) {}
  }
  if (document.readyState !== 'loading') mount(); else document.addEventListener('DOMContentLoaded', mount);
  window.FCCSpots = { names: Object.keys(SP), svg: function (n) { return SP[n] || ''; }, place: scan };
})();
</script>
