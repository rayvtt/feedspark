<!-- FCC-APPS: the ▦ overflow in the topbar for modules kept OUT of the core menu.
     Ray, Sep 2026: "hide the price on the core menu — I don't use it much — and allow it
     to be shown again when needed in the dashboard icon." The Pricer (hourly/retainer rate
     card) lives here now; the volume-based AI Quote took its place in the core nav.
     Injected on every app page (worker), so it's identical everywhere. -->
<style>
#fcc-apps{position:relative;flex:none;margin-left:2px}
#fcc-apps-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line,#E6E6E6);background:transparent;color:var(--ink-2,#4a4a4a);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .15s,color .15s,border-color .15s}
#fcc-apps-btn:hover,#fcc-apps.open #fcc-apps-btn{border-color:var(--orange,#F5A623);color:var(--orange-deep,#ED6F0B)}
#fcc-apps-menu{position:absolute;top:calc(100% + 8px);right:0;z-index:80;background:#fff;border:1px solid var(--line,#E6E6E6);border-radius:12px;box-shadow:0 14px 40px rgba(16,24,40,.18);padding:7px;min-width:210px;display:none}
#fcc-apps.open #fcc-apps-menu{display:block}
#fcc-apps-menu .ah{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:var(--muted,#8a94a0);padding:4px 8px 6px}
#fcc-apps-menu a{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink-2,#4a4a4a);font-size:13px;font-weight:800;padding:8px 9px;border-radius:9px}
#fcc-apps-menu a:hover{background:var(--wash,#F7F7F5);color:var(--orange-deep,#ED6F0B)}
#fcc-apps-menu a .amd{font-size:11px;font-weight:700;color:var(--muted,#8a94a0)}
#fcc-apps-menu a svg{flex:none}
[data-theme=dark] #fcc-apps-menu{background:#1C1F27;border-color:#2C3039}
[data-theme=dark] #fcc-apps-menu a:hover{background:#20242E}
</style>
<script>
(function(){
  if(document.getElementById('fcc-apps'))return;
  function mount(){
    var tb=document.querySelector('.topbar-in'); if(!tb)return;
    var host=document.createElement('div'); host.id='fcc-apps';
    host.innerHTML='<button id="fcc-apps-btn" type="button" aria-label="More tools" title="More tools" aria-haspopup="true" aria-expanded="false">'
      +'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1.4"/><rect x="14" y="3.5" width="6.5" height="6.5" rx="1.4"/><rect x="3.5" y="14" width="6.5" height="6.5" rx="1.4"/><rect x="14" y="14" width="6.5" height="6.5" rx="1.4"/></svg></button>'
      +'<div id="fcc-apps-menu" role="menu">'
      +'<div class="ah">More tools</div>'
      +'<a href="/pricer" role="menuitem"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 13.4 12 4.8H5v7l8.6 8.6a2 2 0 0 0 2.8 0l4.2-4.2a2 2 0 0 0 0-2.8Z"/><circle cx="8.5" cy="8.3" r="1.4"/></svg><span>Pricer<div class="amd">Hourly / retainer rate card</div></span></a>'
      +'</div>';
    // sit just before the theme toggle if present, else at the end of the bar
    var tgl=document.getElementById('theme-tgl'); if(tgl)tb.insertBefore(host,tgl); else tb.appendChild(host);
    var btn=host.querySelector('#fcc-apps-btn');
    btn.addEventListener('click',function(e){ e.stopPropagation(); var o=host.classList.toggle('open'); btn.setAttribute('aria-expanded',o?'true':'false'); });
    document.addEventListener('click',function(e){ if(!host.contains(e.target))host.classList.remove('open'); });
    document.addEventListener('keydown',function(e){ if(e.key==='Escape')host.classList.remove('open'); });
  }
  if(document.readyState!=='loading')mount(); else document.addEventListener('DOMContentLoaded',mount);
})();
</script>
