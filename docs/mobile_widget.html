<!-- FCC-MOBILE: the phone layer (Ray, 15 Sep 2026: "complete overhaul for UX UI for mobile
     version — MIRROR desktop setting"). Every app page keeps its desktop feature set on a phone:
     the SAME module nav node (#tb-modules — same anchors, same order, the viewer's own menu /
     ▦-bundle customisation) becomes a fixed bottom bar with icon + label tap targets; the ▦
     sheet, the presence popover, the view-as pill and the customizer become bottom sheets; the
     topbar collapses to one 52px row (wordmark · collapse · ▦ · presence · theme · language);
     controls that pages used to HIDE under 900px (Golden Record's per-attribute actions, the
     brief composer's context rail, the AI Quote rate columns, the home CTA) are shown again;
     and anything wider than the screen — tables, min-width workbenches, the quote grid — pans
     inside its own frame instead of crushing the page ("pan, don't crush", the Workflow rule).
     Injected worker-side on app pages only (never client decks), after the other widgets. -->
<style>
@media (max-width:760px){
  :root{--fcc-bar:70px}
  html{-webkit-text-size-adjust:100%}
  body{padding-bottom:calc(var(--fcc-bar) + env(safe-area-inset-bottom,0px))!important}
  :root.nav-collapsed body{padding-bottom:env(safe-area-inset-bottom,0px)!important}

  .topbar{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:var(--paper,#fff)!important;padding-top:env(safe-area-inset-top,0px)}

  .topbar-in .brand{font-size:16px;flex:none;white-space:nowrap;display:inline-flex;align-items:center}
  .topbar-in .brand .spk-flame{width:11px!important;height:15px!important;margin-left:2px;flex:none}
  .topbar-in .tb-tag,.topbar-in .tb-who{display:none!important}
  .topbar-in .nav-collapse{margin-left:auto!important;padding:4px}
  #fcc-apps{margin-left:0!important}
  #fcc-presence{margin-left:0!important}

  #theme-tgl{margin-left:0!important;width:34px;height:34px}
  #lang-tgl{margin-left:0!important;padding:5px 7px}

          the desktop collapse toggle collapses the bar too (mirror), the ▦ sheet still lists all ---- */

  #tb-modules::-webkit-scrollbar{display:none}
  :root.nav-collapsed #tb-modules{display:none!important}
  #tb-modules a.tbm{flex:0 0 70px;width:70px!important;height:58px!important;flex-direction:column;justify-content:center;gap:2px;border-radius:10px;scroll-snap-align:center;padding:0 3px;color:var(--ink-2,#4a4a4a);text-decoration:none!important}

  #fcc-navcz{width:100%!important;max-height:86vh!important;padding:16px!important}

  .modal,.pdpm,.fg,.ask-box,#lb .lb-in{max-width:calc(100vw - 12px)!important}
  /* mirror the desktop: what the pages used to hide under 900px is back */
  .at-row{grid-template-columns:minmax(0,1fr) 56px 64px!important;row-gap:4px!important}
  .at-nm,.at-note,.at-act{grid-column:1 / -1!important}

  .at-act{display:flex!important;justify-content:flex-start!important;flex-wrap:wrap!important;gap:6px!important}
  .wf-cta .wf-go{display:inline-flex!important}
  .bs-ctx{display:block!important;max-height:none!important}
  .bg-mhead .mc{display:block!important}
  .court .ct-s{display:block!important}
  .qhead .rate-h,.qhead .line-h,.qrow .col-rate,.qrow .col-line,.qrow .col-mth,.qhead .mth-h{display:block!important}
  .qrows{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .qrows .qrow,.qhead{min-width:760px}
  /* inputs at 16px stop iOS zooming on focus; checkboxes and buttons get a thumb's worth of target */
  input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]):not([type=file]),select,textarea{font-size:16px!important}
  input[type=checkbox],input[type=radio]{width:18px;height:18px}
  button:not(.instr-tgl):not(.info-btn):not(.tbm):not(.pz-av):not(.cz-move button):not(.x):not(.close):not(.nav-toggle):not(.nav-collapse):not(#lang-tgl):not(.dz-x):not(.tag):not(.chipx),a.btn{min-height:36px}
  /* pan, don't crush: anything wider than the screen scrolls inside its own frame */
  .fcc-mpan{overflow-x:auto!important;-webkit-overflow-scrolling:touch;max-width:100%;scrollbar-width:thin;overscroll-behavior-x:contain;
    background:linear-gradient(90deg,var(--paper,#fff) 30%,rgba(255,255,255,0)) left/34px 100% no-repeat local,linear-gradient(270deg,var(--paper,#fff) 30%,rgba(255,255,255,0)) right/34px 100% no-repeat local,linear-gradient(90deg,rgba(16,24,40,.14),rgba(16,24,40,0)) left/12px 100% no-repeat scroll,linear-gradient(270deg,rgba(16,24,40,.14),rgba(16,24,40,0)) right/12px 100% no-repeat scroll}
  /* a sticky side rail (the quote total, a context rail) is just another block on a phone */
  .split>aside,.split.side>aside,.split.side>.side,.rail,.side-rail,.sticky-rail{position:static!important;top:auto!important;height:auto!important;max-height:none!important;min-height:0!important}
  .fcc-mpan>table{min-width:max-content}
  .info-pop{max-width:calc(100vw - 28px)!important;left:12px!important;right:12px!important;transform:none!important}
  /* page toolbars that were one desktop row: the status line takes its own line, buttons wrap under */
  .live-bar{flex-wrap:wrap!important;row-gap:6px}
  .live-bar>:not(button){flex:1 1 100%}
  .sec-head{flex-wrap:wrap!important;gap:6px 12px!important;margin-bottom:14px!important}
  .sec-head p{margin-left:0!important;text-align:left!important;max-width:none!important;flex:1 1 100%}
  .dz-head,.gm-head{flex-wrap:wrap!important}
}
</style>
<script>/* FCC-MOBILE */(function () {
