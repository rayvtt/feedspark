<!-- FCC-NAVROW — the module menu gets the row below: every icon, on the right ------------------
     Ray, 25 Sep 2026, over a screenshot of the Command Center topbar: "tidy up this menu
     pleease , or allow the core modules dropdown ai the below row". The first cut (#543) put
     NAMED chips on the row and folded the rest into a "More ▾" while the ▦ bundle button stayed
     in the top row — two places holding hidden modules. Ray, 27 Sep 2026: "I just want to see
     icons, so the icons should stay on the right. There's no point in having the first bar with
     bundle tool and more … keep all the icons of the menu on the right-hand side, below the text
     on the first row, for visual clarity and cadence."

     So: row one is the wordmark, the page tag, the viewer's name and the widgets; row two is
     EVERY module as the icon it always was, right-aligned under them — nothing folded, nothing
     bundled, one place. The hover tooltip the icons always carried (data-lbl) names them. Nothing
     is bundled out of the box any more (docs/apps_widget.html DEFAULT_APPS is empty — the Pricer
     used to be), so on a fresh device the row simply IS the nav; on the desktop the ▦ bundle
     button is hidden and anything a viewer's own saved layout had bundled is put back on the row
     at its canonical slot, since the bundle does not exist there to reach it from. Under 760px
     the phone layer owns the node and the ▦ customiser keeps its purpose there — a viewer's
     bundling is honoured on the phone, and a desktop→phone resize hands a re-homed anchor back.

     THE NAV NODE IS NEITHER MOVED NOR REWRITTEN. tools/check_nav.js compares that markup byte
     for byte across 24 pages, MODGATE hides the anchors a signin may not open (an inline style
     that travels with the anchor wherever it sits, so a denied module is never shown here
     either), and the phone layer moves the very same node into the bottom bar under 760px.
     Every write here is idempotent — an anchor already on the row is left alone — so an idle
     page rewrites nothing and the observer never chases its own writes (the first cut shipped
     re-measuring itself sixty times a second; measured, not read).
-->
<style>
/* the row is desktop only: under 760px docs/mobile_widget.html moves this same node into the
   fixed bottom bar, and two owners for one node is how a phone layout breaks. */
@media (min-width: 761px) {
  body.fcc-navrow .topbar-in { flex-wrap: wrap; row-gap: 0; }
  body.fcc-navrow .topbar-in > #tb-modules {
    order: 90; flex: 1 0 100%; width: 100%;
    margin: 8px 0 0 !important; padding: 7px 0 0;
    border-top: 1px solid var(--line, #E6E6E6);
    display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 3px;
  }
  /* the ☰ toggle hides the menu with `.nav-collapsed .tb-modules{display:none}` — two classes,
     which the id selector above beats, so it is restated here or the button silently dies */
  .nav-collapsed body.fcc-navrow .topbar-in > #tb-modules,
  body.fcc-navrow.nav-collapsed .topbar-in > #tb-modules { display: none }
  /* the ▦ bundle is the phone's tool; on the desktop every module is on the row */
  body.fcc-navrow #fcc-apps { display: none !important }
}
/* a narrow desktop (761–1040px) holds 21+ icons on ONE row only if each gives up a little room:
   38px targets + 3px gaps are 861px at 21 modules, past the 856px a 900px window leaves */
@media (min-width: 761px) and (max-width: 1040px) {
  body.fcc-navrow .topbar-in > #tb-modules { gap: 1px; }
  body.fcc-navrow .topbar-in > #tb-modules a.tbm { width: 34px; }
}
@media print { body.fcc-navrow .topbar-in > #tb-modules { display: none !important } }
</style>
<script>
(function () {
  if (window.__fccNavRow) return; window.__fccNavRow = 1;
  // the canonical order, read NOW — this runs at parse time, before the ▦ customiser (which
  // waits for DOMContentLoaded) has moved a single anchor out of the nav
  var CANON = [].slice.call(document.querySelectorAll('#tb-modules a.tbm')).map(function (a) { return a.getAttribute('href'); });
  var quiet = false, raf = 0, runs = 0, obs = null;

  function wide() { try { return matchMedia('(min-width:761px)').matches; } catch (e) { return true; } }
  function nav() { return document.getElementById('tb-modules'); }
  function slot(a) { var i = CANON.indexOf(a.getAttribute('href')); return i < 0 ? 1e9 : i; }

  // a bundled anchor goes back on the row at its canonical slot, wearing the icon tile it always
  // was: the bundle's own row styling (.napps + its .nl label) comes off. Marked, so the phone
  // layer can be handed it back.
  function rehome(a, n) {
    a.classList.remove('napps'); var l = a.querySelector('.nl'); if (l) l.remove();
    a.setAttribute('data-nv-home', 'apps');
    var kids = [].slice.call(n.querySelectorAll('a.tbm')), before = null, me = slot(a);
    for (var i = 0; i < kids.length; i++) { if (slot(kids[i]) > me) { before = kids[i]; break; } }
    n.insertBefore(a, before);
  }
  // …and back to the ▦ bundle when the viewport drops to the phone, in the bundle's own dress
  function unhome(a) {
    var wrap = document.getElementById('fcc-apps-wrap'); if (!wrap) return;
    a.removeAttribute('data-nv-home'); a.classList.add('napps');
    if (!a.querySelector('.nl')) { var s = document.createElement('span'); s.className = 'nl'; s.textContent = a.getAttribute('data-lbl') || ''; a.appendChild(s); }
    wrap.appendChild(a);
    var host = document.getElementById('fcc-apps'), hdr = document.getElementById('fcc-apps-hdr');
    if (host) host.classList.add('hasapps');
    if (hdr) { hdr.textContent = 'Bundled tools'; hdr.className = 'ah'; }
  }

  function layout() {
    var n = nav(); if (!n) return;
    quiet = true; runs++;
    if (wide()) [].slice.call(document.querySelectorAll('#fcc-apps-menu a.tbm')).forEach(function (a) { rehome(a, n); });
    else [].slice.call(n.querySelectorAll('a.tbm[data-nv-home]')).forEach(unhome);
    quiet = false;
  }
  function schedule() { if (quiet) return; cancelAnimationFrame(raf); raf = requestAnimationFrame(layout); }

  function mount() {
    var n = nav(); if (!n) return;
    document.body.classList.add('fcc-navrow');
    layout();
    addEventListener('resize', schedule);
    // the ▦ customiser re-appends anchors after we mount (and on a phone, whenever it is used)
    try {
      obs = new MutationObserver(schedule);
      obs.observe(n, { childList: true });
      var wrap = document.getElementById('fcc-apps-wrap'); if (wrap) obs.observe(wrap, { childList: true });
    } catch (e) {}
    setTimeout(schedule, 400);
  }

  if (document.readyState !== 'loading') mount(); else document.addEventListener('DOMContentLoaded', mount);
  window.FCCNavRow = { layout: layout, runs: function () { return runs; } };
})();
</script>
