name = "feedspark"
main = "cloudflare/feedspark-deck/src/worker.js"
compatibility_date = "2024-12-01"

# Bundle the deck HTML as a Text module so `import DECK from "...html"` in the worker
# inlines the deck at build time. Push to main -> Cloudflare rebuilds -> new deck live.
# feedlab_engine.js is ALSO a Text module: the worker serves it verbatim at
# /feedlab/engine.js (the Feed Lab page and its node tests share the same file).
rules = [
  { type = "Text", globs = ["**/*.html", "**/feedlab_engine.js", "**/pricer_engine.js", "**/gpc_taxonomy.txt"], fallthrough = true },
  # Client materials bank (docs/materials/): flagship decks/one-pagers are git-bundled as
  # binary Data modules so they are live the moment they merge -- a session cannot write a
  # blob into KV (Access blocks HTTP writes and there is no key-level API here). Everything
  # uploaded later goes to KV instead; see docs/MATERIALS.md for the boundary.
  { type = "Data", globs = ["**/materials/*.pptx", "**/materials/*.pdf", "**/materials/*.xlsx"], fallthrough = true },
  # KWCal client-calendar seeds (docs/calseed/): each brand's shared marketing-planner slide,
  # git-bundled and served at /kwcal/cal/<file> — the side-by-side default when KV has no calImg.
  { type = "Data", globs = ["**/calseed/*.webp", "**/calseed/*.jpg", "**/calseed/*.png"], fallthrough = true }
]

# The account owner — the only identity allowed to open /activity and /api/activity
# (matched against Cloudflare Access's verified Cf-Access-Authenticated-User-Email).
[vars]
OWNER_EMAIL = "ray@feedspark.com"

# Crons (routed by event.cron in scheduled(); separate firings = separate subrequest
# budgets): :00 = Label Guard estate sweep + hourly warm of the live plan-sync cache
# (KV planlive:<id>); :30 = custom-watch pass for HOURLY-schedule rules; 07:00 & 17:00
# UTC/GMT = custom-watch pass for TWICE-DAILY rules (Ray's morning / end-of-day checks).
[triggers]
crons = ["0 * * * *", "30 * * * *", "0 7,17 * * *"]

# Ray's in-browser copy edits (data-eid patches) live here; they re-overlay client-side.
[[kv_namespaces]]
binding = "EDITS"
id = "d93b5ac576c74f0d8a315c5b92dc8e16"

# Tachyon copilot (/api/claude) reads the Anthropic API key from a Worker SECRET — never
# committed here. Set it once and the copilot goes live with no redeploy:
#   wrangler secret put ANTHROPIC_API_KEY        (run from this repo root)
#   — or Cloudflare dashboard → Workers → feedspark → Settings → Variables → Add secret.
# Until it's set, /api/claude returns a friendly "not connected yet" message and the
# in-dashboard copilot stays usable (it shows the setup step instead of an answer).

# One-time migration (must sit after all top-level keys like `rules`, or TOML folds them
# into this table). The live worker carried an orphaned Durable Object class `Store` that
# was never in this repo — the app is 100% KV-backed (see [[kv_namespaces]] above) — so
# Cloudflare rejected every `wrangler deploy` with "does not export class 'Store'" (code
# 10064). This deletes that unused class so deploys go through. It does NOT touch the EDITS
# KV namespace (a separate store), where all real data lives.
#
# Tag is "v2": Cloudflare already has migration tag "v1" recorded for this script (from
# whatever originally created the Store DO), so a "v1" delete is treated as already-applied
# and skipped. "v2" makes wrangler actually send the delete.
[[migrations]]
tag = "v2"
deleted_classes = ["Store"]
