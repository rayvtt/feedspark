<!-- FCC-DIGEST: the SKIM VIEW — the phone layer's second half (Ray, 18 Sep 2026, holding up the
     Meta Ads Manager app on an iPhone 16 Pro: "the whole dashboard is not functional on mobile
     users … it only shows what necessary to be shown … only necessary information for AM to make
     decisions while using mobile phone and make it as on the go as possible … if you go on the
     desktop view that would be more if needed. Allow using a lot of collapse and expand feature").
     Under 760px every page opens as a DIGEST: the hero + its KPI strip stay, and every section
     below becomes ONE tap row — its own heading, restyled (chevron · title · a digest read off the
     section's content: KPI headlines, alert counts, row counts) — with the content folded behind
     it. Two shapes, one mechanism: a block that CONTAINS its heading (section.cat, .card, .panel —
     Golden Record, Command Center, Volume) and a heading that sits as a SIBLING above its content
     (Workflow's h2s, Leadership, KWCal). Nothing is removed and no node moves: the heading keeps
     its own buttons (the page's i-popover, the ⓘ explainer toggle, the page's own ▸ Show — a heading
     that already carries a toggle is left to the page), content is hidden by a class the desktop
     media query never applies, so the desktop is byte-identical and the phone MIRRORS it one tap
     down. Default = every section closed when the page has two or more (one section is nothing to
     skim among); a section that appears AFTER boot opens (it arrived because the reader did
     something); a device remembers what its reader opened (localStorage fcc-m-open); a #hash link
     into a folded section opens it; tables show 8 rows with "Show all N". Expand all / Collapse all
     sit above the first row. window.FCCDigest exposes state/expandAll/collapseAll for the phone
     tripwire (tools/check_mobile.js), which asserts the fold at first paint and then expands
     everything before its desktop-parity count. Injected worker-side after the phone layer. -->
