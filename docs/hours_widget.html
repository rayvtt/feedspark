<!-- FCC-HOURS: the hours badge, everywhere (Ray, 16 Sep 2026).

     "this hour report should appear everywhere in [the FCC], for example with workflow, and flag
      whether the client is negative or not. It should also show the trajectory of the past three
      months of client activity per hour. It would be like a hovering pop-up, so it doesn't
      clutter the current dashboard. At the same time, display it within brand [dossier] and other
      areas in the FCC that are appropriate for an AM to decide whether to continue the task with
      the current hours. Obviously, there are cases where a client is negative, but because of
      relationship smoothing, the AM may still continue the task. Consider that perspective."

     WHAT IS ADDED TO A PAGE: one 8px dot. That is the whole inline footprint — the brief was
     explicitly that this must not clutter what is already there, so everything else lives in a
     popover that only exists while someone is looking at it.

     WHAT THE DOT SAYS: whether the client is negative. What it deliberately does NOT say is what
     to do about it. A balance is a fact the reports database states; whether to keep working the
     account is a judgement an AM makes, often for reasons the hours cannot see. So the popover
     carries a POSTURE the team sets — Continue / Hold new work / Just watching — and an account
     someone has decided to keep serving reads as "being served anyway" rather than going on
     shouting red at every person who opens any page. The alarm stops; the fact does not change.

     One /api/hours fetch per page, shared by every badge on it: balance (the hours lane), the
     three-month trail (the Task Manager book) and the posture (shared state), merged server-side.
     Injected on app pages only, never on client decks. -->
<style>

<script>/* FCC-HOURS */(function () {
  'use strict';
  if (window.__fccHours) return; window.__fccHours = 1;
  if (/^\/deck\//.test(location.pathname)) return;
  // the Feed Chat bubble embeds /feedchat in a small iframe — a popover in there would be clipped
  // by the frame, and the host page already carries its own dots
  if (/[?&]embed=1/.test(location.search)) return;

  var DATA = null, ME = '', BASE = 0, POST = null, pop = null, openFor = '', pinned = false, tOpen = null, tShut = null;
  var fold = function (s) { return String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]+/g, ''); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var h1 = function (n) { return (Math.round((Number(n) || 0) * 100) / 100).toLocaleString(undefined, { maximumFractionDigits: 2 }); };
  var cvar = function (n, f) { try { return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || f; } catch (e) { return f; } };
  var dark = function () { return document.documentElement.getAttribute('data-theme') === 'dark'; };
  var BIL = function () { return dark() ? '#4C82E0' : '#2563EB'; };
  var NBIL = function () { return dark() ? '#C67B28' : '#ED6F0B'; };

  // ---- the engine's own rules, kept identical to src/taskbook.js -----------------------------
  var POSTURES = {
    continue: { label: 'Continue', short: 'Continuing', note: 'Work continues regardless of the balance — a deliberate call.' },
    hold: { label: 'Hold new work', short: 'On hold', note: 'No new work until the balance is settled.' },
    watch: { label: 'Just watching', short: 'Watching', note: 'No decision taken — the balance is being watched.' }
  };
  var STATE_LABEL = { none: 'No hours synced', ok: 'Within the retainer', tight: 'Close to the block',
    over: 'Over the retainer', served: 'Over — being served anyway', held: 'Over — new work on hold' };
  function hoursState(r) {
    r = r || {};
    var posture = (r.posture && r.posture.state) || '', bal = Number(r.balance) || 0, allowance = Number(r.allowance) || 0;
    if (!r.tracked) return 'none';
    if (bal < 0) return posture === 'continue' ? 'served' : (posture === 'hold' ? 'held' : 'over');
    if (allowance > 0 && bal < allowance * 0.25) return 'tight';
    return 'ok';
  }
  function hoursVerdict(r) {
    r = r || {};
    var st = hoursState(r), bal = Number(r.balance) || 0, h = function (n) { return h1(Math.abs(n)); };
    if (st === 'none') return 'No hours have been synced for this client yet.';
    if (st === 'ok') return h(bal) + ' hours left against a ' + h(r.allowance) + '-hour block.';
    if (st === 'tight') return 'Only ' + h(bal) + ' hours left of the ' + h(r.allowance) + '-hour block — the next piece of work will likely take it under.';
    if (st === 'served') return h(bal) + ' hours over, and the team has decided to keep going anyway.';
    if (st === 'held') return h(bal) + ' hours over, and new work is on hold until it is settled.';
    return h(bal) + ' hours over the block — worth a decision before the next task.';
  }
  function trailRows(t) {
    var keys = (t && t.months) || [];
    return keys.map(function (k) {
      var c = (t.m && t.m[k]) || [0, 0, 0], bill = (c[0] || 0) / 4, nb = (c[1] || 0) / 4;
      return { month: k, bill: bill, nonbill: nb, hours: Math.round((bill + nb) * 100) / 100, n: c[2] || 0, partial: k === t.current };
    });
  }
  function trailTrend(rows) {
    var done = (rows || []).filter(function (r) { return !r.partial; });
    if (done.length < 2) return { dir: 'flat', pct: 0, enough: false };
    var a = done[done.length - 2].hours, b = done[done.length - 1].hours;
    if (!a && !b) return { dir: 'flat', pct: 0, enough: true };
    var pct = a ? Math.round(((b - a) / a) * 100) : 100;
    return { dir: pct > 8 ? 'up' : pct < -8 ? 'down' : 'flat', pct: pct, enough: true };
  }
  /* FCC-HOURS:ENGINE-END */

  // ---- data ------------------------------------------------------------------------------------
  function recOf(name) {
    if (!DATA || !DATA.clients) return null;
    var k = fold(name);
    if (!k) return null;
    var keys = Object.keys(DATA.clients);
    for (var i = 0; i < keys.length; i++) if (fold(keys[i]) === k) return { name: keys[i], rec: DATA.clients[keys[i]] };
    return null;
  }
  function load(then) {
    fetch('/api/hours').then(function (r) { return r.json(); }).then(function (d) {
      if (d && d.ok) {
        DATA = d; decorate();
        // pages that render hours INTO their own layout (the dossier's portfolio band) can't
        // know when this fetch lands — so say so rather than making them poll
        try { document.dispatchEvent(new CustomEvent('fcc-hours')); } catch (e) {}
      }
      if (then) then();
    }).catch(function () { if (then) then(); });
  }
  function who() {
    if (ME) return;
    fetch('/api/access?me=1').then(function (r) { return r.json(); })
      .then(function (d) { ME = (d && (d.name || d.ownerName || d.email)) || ''; }).catch(function () {});
  }

  // ---- the dot -----------------------------------------------------------------------------------
  function dotFor(name) {
    var hit = recOf(name), st = hit ? hoursState(hit.rec) : 'none';
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'fh-dot'; b.setAttribute('data-st', st);
    b.setAttribute('data-fh', hit ? hit.name : name);
    b.setAttribute('aria-label', name + ' — ' + STATE_LABEL[st] + '. Hours report.');
    b.title = name + ' — ' + STATE_LABEL[st];
    b.innerHTML = '<i></i>';
    b.addEventListener('mouseenter', function () { hoverOpen(b); });
    b.addEventListener('mouseleave', function () { hoverShut(); });
    b.addEventListener('focus', function () { show(b, true); });
    b.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); show(b, true); });
    return b;
  }

  // WHERE THE DOT GOES. `data-hrs="<client>"` is the explicit anchor a page opts into; on top of
  // that every module page that picks a brand from a <select id="brand"> gets one automatically,
  // following the selection — which is most of the FCC without touching most of the FCC.
  //
  // `data-hrs-flag` narrows it to the EXCEPTION. A long table repeats one client down hundreds of
  // rows, and a healthy dot on every one of them is decoration, not information (Ray's ask was a
  // hovering read-out that "doesn't clutter the current dashboard"). On a flag anchor the dot is
  // drawn only when the balance is worth stopping at — tight, over, deliberately served, or held —
  // so an intake row stays silent while the account is fine and speaks up the moment it is not.
  function flagged(st) { return st === 'tight' || st === 'over' || st === 'served' || st === 'held'; }
  function decorate() {
    if (!DATA) return;
    var i, els = document.querySelectorAll('[data-hrs]');
    for (i = 0; i < els.length; i++) {
      var el = els[i], name = el.getAttribute('data-hrs');
      if (!name) continue;
      var hit = recOf(name), st = hit ? hoursState(hit.rec) : 'none';
      // the stamp carries the STATE as well as the name, so a posture saved in the popover (or a
      // fresh sync) repaints the dot instead of being masked by an "already decorated" guard
      var stamp = name + '|' + st;
      if (el.__fh === stamp) continue;
      el.__fh = stamp;
      var old = el.querySelector(':scope > .fh-dot'); if (old) old.remove();
      if (el.hasAttribute('data-hrs-flag') && !flagged(st)) continue;
      el.appendChild(dotFor(name));
    }
    var sel = document.getElementById('brand');
    if (sel && sel.tagName === 'SELECT') {
      var host = sel.parentNode;
      if (host && !host.__fhSel) {
        host.__fhSel = 1;
        sel.addEventListener('change', function () { setTimeout(syncSel, 0); });
      }
      syncSel();
    }
  }
  function syncSel() {
    var sel = document.getElementById('brand'); if (!sel) return;
    var name = sel.value === '*' ? '' : sel.value;
    var cur = document.getElementById('fh-sel');
    if (!name || !recOf(name)) { if (cur) cur.remove(); return; }
    var d = dotFor(name); d.id = 'fh-sel'; d.style.marginLeft = '6px';
    if (cur) cur.replaceWith(d); else sel.parentNode.insertBefore(d, sel.nextSibling);
  }

  // ---- the popover ----------------------------------------------------------------------------
  function ensure() {
    if (pop) return pop;
    pop = document.createElement('div');
    pop.id = 'fcc-hrs';
    pop.setAttribute('role', 'dialog');
    pop.addEventListener('mouseenter', function () { if (tShut) { clearTimeout(tShut); tShut = null; } });
    pop.addEventListener('mouseleave', function () { if (!pinned) hoverShut(); });
    document.body.appendChild(pop);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hide(); });
    document.addEventListener('click', function (e) {
      if (!pinned || !pop.classList.contains('on')) return;
      if (pop.contains(e.target) || (e.target.closest && e.target.closest('.fh-dot'))) return;
      hide();
    });
    window.addEventListener('resize', function () { if (pop.classList.contains('on') && openAnchor) place(openAnchor); });
    return pop;
  }
  var openAnchor = null;
  function hoverOpen(b) { if (tShut) { clearTimeout(tShut); tShut = null; } if (tOpen) clearTimeout(tOpen); tOpen = setTimeout(function () { show(b, false); }, 120); }
  function hoverShut() { if (tOpen) { clearTimeout(tOpen); tOpen = null; } if (pinned) return; if (tShut) clearTimeout(tShut); tShut = setTimeout(hide, 260); }
  function hide() { pinned = false; openFor = ''; openAnchor = null; if (pop) pop.classList.remove('on'); }

  function show(b, pin) {
    var name = b.getAttribute('data-fh');
    ensure();
    if (pin) pinned = true;
    if (openFor !== name) { openFor = name; pop.innerHTML = body(name); wire(name); }
    openAnchor = b;
    pop.classList.add('on');
    place(b);
    who();
  }
  function place(b) {
    if (window.matchMedia && window.matchMedia('(max-width:760px)').matches) return;   // bottom sheet
    var r = b.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
    var left = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), window.innerWidth - w - 8);
    var top = r.bottom + 9;
    if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 9);
    pop.style.left = left + 'px'; pop.style.top = top + 'px';
  }

  // THE TRAIL. Three stacked bars — billable below, non-billable above — one per calendar month.
  // The CURRENT month is hatched and labelled "so far": plotting a part-month as a completed one
  // makes every account look like it fell off a cliff on the 3rd, which is the opposite of the
  // trajectory this is meant to show. Both series carry their numbers in the key, which is also
  // the relief the palette validator asks for on the orange at light-mode contrast.
  /* SKIPPED SCHEDULED WORK — the schedule's own go/skip strip, carried here.

     Ray, 16 Sep 2026: "This pop-up over retainer should also include the skipped schedule work",
     then "no i prefer the dotted green and orange bar for go and skip that you have, just try to
     fit 3 at least in that popup."

     The balance says what the account has COST. This says what it has DECLINED — the ASPL weekly
     schedule of keyword / title / product-type work the AM answered "Skip" to. The two belong side
     by side at exactly this moment: an account over its retainer that is also turning work away is
     a different conversation from one that is over BECAUSE it takes everything offered.

     One cell per calendar month, twelve of them, in the /schedule module's own colours so the two
     surfaces read the same: green went ahead, orange skipped, grey scheduled-but-undecided, and
     PALE = never scheduled that month. That last one is the honest distinction the whole strip
     turns on — a month nothing was offered in is not a month anything was refused. */
  var SKIPC = { g: { c: '#2E7D32', t: 'went ahead' }, s: { c: '#ED6F0B', t: 'skipped' },
    n: { c: '#C9CDD3', t: 'scheduled, no decision recorded' }, '-': { c: '', t: 'not scheduled' } };
  function moLabel(k) {
    var d = new Date(k + '-01T00:00:00Z');
    return d.toLocaleDateString(undefined, { month: 'short', year: '2-digit', timeZone: 'UTC' });
  }
  // the schedule's own kind labels, with the one that will not fit a 94px column shortened
  var KSHORT = { 'Product Type': 'Prod Type', 'Data tagging': 'Data tag', 'Social titles': 'Social' };
  function strip(row, months) {
    var cells = String(row.s || '').split('').map(function (ch, i) {
      var sp = SKIPC[ch] || SKIPC['-'], k = months[i] || '';
      return '<i class="' + (ch === '-' ? 'off' : '') + '"' + (sp.c ? ' style="background:' + sp.c + '"' : '')
        + ' title="' + esc(moLabel(k) + ' — ' + sp.t) + '"></i>';
    }).join('');
    var kind = row.kind || 'Scheduled';
    var name = '<b>' + esc(KSHORT[kind] || kind) + '</b>'
      + (row.mkt ? '<span>' + esc(String(row.mkt).toUpperCase()) + '</span>' : '');
    var tail = row.streak ? '<b>' + row.streak + 'mo</b>' : '<span class="ok">\u2713</span>';
    var rt = kind + (row.mkt ? ' \u00b7 ' + String(row.mkt).toUpperCase() : '')
      + (row.streak ? ' \u2014 skipped ' + row.streak + ' month' + (row.streak === 1 ? '' : 's') + ' running'
          + (row.since ? ', since ' + moLabel(row.since) : '')
          + (row.hrsSkip ? ', ' + h1(row.hrsSkip) + ' h not taken' : '') : ' \u2014 no current skip streak');
    return '<div class="fh-sr" title="' + esc(rt) + '"><span class="nm">' + name + '</span><span class="bar">' + cells + '</span>'
      + '<span class="tl">' + tail + '</span></div>';
  }
  function skipBlock(rec, name) {
    var k = rec && rec.skip;
    if (!k || !k.rows || !k.rows.length) return '';
    var months = k.months || [];
    var head = k.onStreak
      ? k.onStreak + ' of ' + k.tasks + ' on a skip streak'
        + (k.hoursSkipped ? ' \u00b7 ' + h1(k.hoursSkipped) + ' h not taken' : '')
      : 'all ' + k.tasks + ' task' + (k.tasks === 1 ? '' : 's') + ' taking the work';
    var h = '<div class="fh-skip"><div class="fh-h5">Scheduled work</div>'
      + '<p class="fh-shead' + (k.onStreak ? ' warn' : '') + '">' + esc(head) + '</p>';
    h += k.rows.map(function (r) { return strip(r, months); }).join('');
    h += '<div class="fh-sleg"><span><i style="background:#2E7D32"></i>went ahead</span>'
      + '<span><i style="background:#ED6F0B"></i>skipped</span>'
      + '<span><i class="off"></i>not scheduled</span>'
      + '<span class="sp">' + esc(moLabel(months[0] || '') + ' \u2192 ' + moLabel(months[months.length - 1] || '')) + '</span></div>';
    if (k.more) h += '<p class="fh-smore">' + k.more + ' more task' + (k.more === 1 ? '' : 's') + ' on the schedule.</p>';
    h += '<a href="/schedule?b=' + encodeURIComponent(name || '') + '">See the full cadence \u2192</a></div>';
    return h;
  }

  function chart(rows) {
    // TWELVE BARS, NOT THREE (Ray, 16 Sep 2026). At three, a value label on every bar was the
    // right call; at twelve it would be a wall of numbers ~25px apart. So the labels go
    // SELECTIVE — the biggest month and the one still running, which are the two an AM reads —
    // the axis anchors quarterly BACK FROM THE CURRENT MONTH (so "now" is always named), and
    // every bar carries its own exact split in a <title> for the hover.
    var W = 300, H = 84, B = 17, TOP = 13, gap = 2;
    var n = rows.length || 1, step = W / n, bw = Math.max(6, Math.min(46, step - 5));
    var max = Math.max.apply(null, rows.map(function (r) { return r.hours; }).concat([1]));
    var dense = n > 4;                 // past four bars a number on every one is a wall, not a read
    var big = -1, bigV = 0, part = -1;
    rows.forEach(function (r, i) { if (r.hours > bigV) { bigV = r.hours; big = i; } if (r.partial) part = i; });
    var s = '';
    s += '<defs><pattern id="fh-part" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">'
      + '<rect width="5" height="5" fill="' + cvar('--paper', '#fff') + '"/><rect width="2.2" height="5" fill="' + NBIL() + '" opacity=".55"/></pattern>'
      + '<pattern id="fh-partb" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">'
      + '<rect width="5" height="5" fill="' + cvar('--paper', '#fff') + '"/><rect width="2.2" height="5" fill="' + BIL() + '" opacity=".55"/></pattern></defs>';
    s += '<line x1="0" y1="' + (H - B) + '" x2="' + W + '" y2="' + (H - B) + '" stroke="' + cvar('--line', '#E6E6E6') + '" stroke-width="1"/>';
    rows.forEach(function (r, i) {
      var x = step * i + (step - bw) / 2, avail = H - B - TOP;
      var hb = max ? (r.bill / max) * avail : 0, hn = max ? (r.nonbill / max) * avail : 0;
      var yb = H - B - hb, yn = yb - hn - (hb > 0 && hn > 0 ? gap : 0);
      var mo = new Date(r.month + '-01T00:00:00Z');
      var full = mo.toLocaleDateString(undefined, { month: 'long', year: 'numeric', timeZone: 'UTC' });
      var tip = full + (r.partial ? ' (still running)' : '') + ' — ' + h1(r.bill) + ' h billable, '
        + h1(r.nonbill) + ' h non-billable' + (r.n ? ' across ' + r.n + ' task' + (r.n === 1 ? '' : 's') : '');
      s += '<g><title>' + esc(tip) + '</title>';
      if (hb > 0) s += '<rect x="' + x.toFixed(1) + '" y="' + yb.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + hb.toFixed(1) + '" rx="1.5" fill="' + (r.partial ? 'url(#fh-partb)' : BIL()) + '"/>';
      if (hn > 0) s += '<rect x="' + x.toFixed(1) + '" y="' + yn.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + hn.toFixed(1) + '" rx="1.5" fill="' + (r.partial ? 'url(#fh-part)' : NBIL()) + '"/>';
      if (!hb && !hn) s += '<rect x="' + x.toFixed(1) + '" y="' + (H - B - 2) + '" width="' + bw.toFixed(1) + '" height="2" rx="1" fill="' + cvar('--line', '#E6E6E6') + '"/>';
      // the transparent full-height hit area keeps the hover target the whole column, not the mark
      s += '<rect x="' + (step * i).toFixed(1) + '" y="0" width="' + step.toFixed(1) + '" height="' + (H - B) + '" fill="transparent"/></g>';
      if (dense ? (i === big || i === part) : true) {
        var top = Math.min(yn, yb) - 3.5;
        s += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (r.hours ? top.toFixed(1) : H - B - 4) + '" text-anchor="middle" font-size="9.5" font-weight="800" fill="' + cvar('--ink', '#333') + '">' + (r.hours ? h1(r.hours) : '0') + '</text>';
      }
      // few bars: name them all. Many: quarterly anchors counted BACK from the current month,
      // so "now" is always one of them.
      if (!dense || (n - 1 - i) % 3 === 0) {
        var lbl = mo.toLocaleDateString(undefined, { month: 'short', timeZone: 'UTC' });
        s += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 5) + '" text-anchor="middle" font-size="9" font-weight="600" fill="' + cvar('--muted', '#8a94a0') + '">' + esc(lbl) + (r.partial ? '\u203a' : '') + '</text>';
      }
    });
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Hours per month over the last ' + n + ' months, billable and non-billable">' + s + '</svg>';
  }

  function ago(ms) {
    if (!ms) return 'never';
    var m = Math.max(0, Math.round((Date.now() - ms) / 60000));
    if (m < 60) return m + ' min ago';
    var hh = Math.round(m / 60);
    return hh < 48 ? hh + 'h ago' : Math.round(hh / 24) + ' days ago';
  }

  function body(name) {
    var hit = recOf(name), rec = hit ? hit.rec : { tracked: false };
    var st = hoursState(rec), t = rec.trail, rows = t ? trailRows(t) : [];
    var h = '<button class="fh-x" type="button" aria-label="Close">✕</button>';
    h += '<h4>' + esc(hit ? hit.name : name) + '<span class="fh-pill ' + st + '">' + esc(STATE_LABEL[st]) + '</span></h4>';
    h += '<div class="fh-sub">' + (rec.markets ? rec.markets + ' market' + (rec.markets === 1 ? '' : 's') : 'no markets synced')
      + (rec.am ? ' · ' + esc(rec.am) : '') + (rec.updated ? ' · balance read ' + ago(rec.updated) : '') + '</div>';

    if (!rec.tracked) {
      h += '<p class="fh-verd">' + esc(hoursVerdict(rec)) + '</p>';
      h += '<p class="fh-note">The reports sync fills the book a few markets at a time. Until this client is read, the FCC has no hours for it — which is not the same as zero.</p>';
    } else {
      h += '<div class="fh-nums">'
        + '<div class="n"><b>' + h1(rec.allowance) + '</b><span>Block / mo</span></div>'
        + '<div class="n"><b>' + h1(rec.used) + '</b><span>Used</span></div>'
        + '<div class="n' + (rec.balance < 0 ? ' neg' : '') + '"><b>' + (rec.balance < 0 ? '−' : '') + h1(Math.abs(rec.balance)) + '</b><span>Balance</span></div>'
        + '</div>';
      h += '<p class="fh-verd">' + esc(hoursVerdict(rec)) + '</p>';
    }

    h += skipBlock(rec, hit ? hit.name : name);

    if (rows.length) {
      var tr = trailTrend(rows), dirW = { up: 'up', down: 'down', flat: 'level' }[tr.dir];
      h += '<div class="fh-h5">Last ' + rows.length + ' months<em>' + (tr.enough
        ? esc(dirW) + (tr.dir === 'flat' ? '' : ' ' + Math.abs(tr.pct) + '%')
        : 'one month so far') + '</em></div>';
      h += chart(rows);
      var tb = rows.reduce(function (a, r) { return a + r.bill; }, 0), tn = rows.reduce(function (a, r) { return a + r.nonbill; }, 0);
      h += '<div class="fh-key"><span><i style="background:' + BIL() + '"></i>Billable ' + h1(tb) + ' h</span>'
        + '<span><i style="background:' + NBIL() + '"></i>Non-billable ' + h1(tn) + ' h</span></div>';
      var part = rows.filter(function (r) { return r.partial; })[0];
      var notes = [];
      if (part) notes.push('The hatched month is still running.');
      if (t.read < t.total) notes.push(t.read + ' of ' + t.total + ' markets read, so these are a floor — the sync is still filling the book.');
      else if (t.at) notes.push('All ' + t.total + ' markets read, newest ' + ago(t.at) + '.');
      if (notes.length) h += '<p class="fh-note">' + esc(notes.join(' ')) + '</p>';
    } else if (rec.tracked) {
      h += '<div class="fh-h5">Last 12 months</div><p class="fh-note">No task rows read for this client yet — the reports sync fills the book a few markets at a time, so the trajectory appears once it reaches this one.</p>';
    }

    // THE DECISION, kept apart from the fact. An account can be over its block and still be
    // worked on purpose; saying so here is what stops the red dot reading as an unhandled alarm
    // on every page in the FCC.
    var cur = (rec.posture && rec.posture.state) || '';
    h += '<div class="fh-post"><div class="fh-h5">Our call on it</div><div class="fh-btns">';
    ['continue', 'hold', 'watch'].forEach(function (k) {
      h += '<button type="button" data-post="' + k + '" class="' + (cur === k ? 'on' : '') + '">' + esc(POSTURES[k].label) + '</button>';
    });
    h += '</div>';
    if (cur) {
      // WHY, in the AM's own words. "Relationship smoothing" is a judgement about a client, and
      // the judgement is the part the next person needs — the state alone just says somebody
      // clicked a button. Optional, one line, and it travels with the decision.
      h += '<input class="fh-why" type="text" maxlength="160" placeholder="Why — one line the next AM will read" value="'
        + esc((rec.posture && rec.posture.note) || '') + '">';
      h += '<div class="fh-who">' + ((rec.posture && rec.posture.note) ? '' : esc(POSTURES[cur].note) + ' ')
        + (rec.posture.by ? 'Set by ' + esc(rec.posture.by) : '') + (rec.posture.at ? ' ' + ago(rec.posture.at) : '') + '</div>';
    }
    else h += '<div class="fh-who">Nobody has recorded a decision. A negative balance is a fact, not an instruction — the call is the AM’s.</div>';
    h += '</div>';

    h += '<div class="fh-links"><a href="/tasks?q=client:' + encodeURIComponent(hit ? hit.name : name) + '">Open the hours book →</a>'
      + '<a href="/leadership">Commercial view →</a></div>';
    return h;
  }

  function wire(name) {
    var x = pop.querySelector('.fh-x'); if (x) x.onclick = hide;
    var btns = pop.querySelectorAll('button[data-post]');
    Array.prototype.forEach.call(btns, function (b) {
      b.onclick = function () {
        var k = b.getAttribute('data-post');
        var hit = recOf(name), key = hit ? hit.name : name;
        var rec = hit ? hit.rec : null;
        var cur = (rec && rec.posture && rec.posture.state) || '';
        var next = cur === k ? '' : k;           // clicking the set one clears it
        Array.prototype.forEach.call(btns, function (o) { o.disabled = true; });
        var keep = (cur === k && rec && rec.posture && rec.posture.note) || '';
        savePosture(key, next, next ? keep : '', function (ok) {
          if (ok && rec) rec.posture = next ? { state: next, by: ME, at: Date.now(), note: keep } : null;
          if (ok) { openFor = ''; show(openAnchor || btns[0], true); decorate(); }
          else Array.prototype.forEach.call(btns, function (o) { o.disabled = false; });
        });
      };
    });
    var why = pop.querySelector('.fh-why');
    if (why) {
      var commit = function () {
        var hit = recOf(name), rec = hit ? hit.rec : null;
        if (!rec || !rec.posture) return;
        var txt = why.value.trim();
        if (txt === ((rec.posture.note || ''))) return;
        why.disabled = true;
        savePosture(hit.name, rec.posture.state, txt, function (ok) {
          why.disabled = false;
          if (ok) { rec.posture.note = txt; rec.posture.by = ME || rec.posture.by; rec.posture.at = Date.now(); }
        });
      };
      why.addEventListener('blur', commit);
      why.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); why.blur(); } });
    }
  }

  // The posture rides the SAME shared-state store every other team-visible decision uses
  // (/api/state, kvmerge, X-Sync-Base), so one AM's call is every AM's call — the whole point.
  function savePosture(client, state, note, then) {
    var send = function () {
      var body = { hourspost: {} };
      body.hourspost[client] = state ? { state: state, note: String(note || '').slice(0, 160), by: ME || '', at: Date.now() } : null;
      fetch('/api/state', { method: 'PUT', headers: { 'content-type': 'application/json', 'X-Sync-Base': String(BASE || 0) }, body: JSON.stringify(body) })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok && d && d.ok !== false, d: d }; }); })
        .then(function (r) { then(r.ok); })
        .catch(function () { then(false); });
    };
    if (BASE) return send();
    fetch('/api/state?ns=hourspost').then(function (r) { BASE = Number(r.headers.get('X-Sync-Base') || 0) || Date.now(); return r.json(); })
      .then(send).catch(function () { BASE = Date.now(); send(); });
  }

  // ---- boot -------------------------------------------------------------------------------------
  function boot() {
    load();
    var t = null;
    if (window.MutationObserver) new MutationObserver(function () {
      if (t) clearTimeout(t);
      t = setTimeout(function () { t = null; decorate(); }, 400);
    }).observe(document.body, { childList: true, subtree: true });
    setInterval(function () { if (!document.hidden) load(); }, 300000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
  }
  if (document.readyState !== 'loading') boot(); else document.addEventListener('DOMContentLoaded', boot);
  window.FCCHours = { reload: load, decorate: decorate, state: hoursState, verdict: hoursVerdict, rec: recOf };
})();</script>
